<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreeToolsHub — Every Free Tool, No Login</title>
<meta name="description" content="A curated directory of truly free tools — no login, no free tiers, no paywall.">
<meta property="og:title" content="FreeToolsHub">
<meta property="og:description" content="Every free tool, no login, no paywall.">
<meta name="theme-color" content="#0c0c0e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0c0e; --surface: rgba(255,255,255,0.03);
    --surface-hover: rgba(255,255,255,0.06);
    --text-1: #f0f0f2; --text-2: rgba(255,255,255,0.55);
    --text-3: rgba(255,255,255,0.35); --line: rgba(255,255,255,0.08);
    --line-hover: rgba(255,255,255,0.15); --radius: 18px; --radius-sm: 10px;
    --space-1:4px; --space-2:8px; --space-3:16px; --space-4:24px;
    --space-5:48px; --space-6:96px; --container:1200px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { background:var(--bg); color:var(--text-1); font-family:'Inter',system-ui,sans-serif; font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased; min-height:100vh; }

  /* Nav */
  nav { position:sticky; top:0; z-index:50; backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); background:rgba(12,12,14,0.7); border-bottom:1px solid var(--line); padding:var(--space-3) 0; }
  nav .inner { max-width:var(--container); margin:0 auto; padding:0 var(--space-4); display:flex; align-items:center; justify-content:space-between; }
  nav .logo { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18px; letter-spacing:-0.01em; }
  nav .logo span { color:var(--text-3); font-weight:400; }
  nav .count { font-size:13px; color:var(--text-3); font-family:'Space Grotesk',sans-serif; }

  /* Hero */
  .hero { padding:var(--space-5) 0 var(--space-3); text-align:center; }
  .hero h1 { font-family:'Fraunces',serif; font-size:clamp(2rem,5vw,3.5rem); font-weight:600; line-height:1.1; letter-spacing:-0.02em; }
  .hero p { margin-top:var(--space-2); color:var(--text-2); font-size:1rem; max-width:560px; margin-left:auto; margin-right:auto; }

  /* Ring View */
  #ringView { padding:var(--space-4) 0 var(--space-6); transition:opacity 0.35s ease; }
  #ringView.fading { opacity:0; pointer-events:none; }

  /* Expanding circle animation */
  .cat-circle.expanding,
  .ring-center.expanding {
    animation: expandFade 0.45s cubic-bezier(0.16,1,0.3,1) forwards;
    pointer-events:none;
  }
  @keyframes expandFade {
    0%   { transform:translate(-50%,-50%) scale(1); opacity:1; }
    100% { transform:translate(-50%,-50%) scale(5); opacity:0; }
  }

  /* List view fade-in */
  #listView { opacity:0; transition:opacity 0.4s ease; }
  #listView.visible { opacity:1; }
  .ring-container {
    position:relative; width:min(90vw, 600px); height:min(90vw, 600px);
    margin:0 auto;
  }
  .ring-center {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:120px; height:120px; border-radius:50%;
    background:var(--surface); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18px;
    cursor:pointer; transition:all 0.3s cubic-bezier(0.16,1,0.3,1);
    z-index:2;
  }
  .ring-center:hover { background:var(--surface-hover); border-color:var(--line-hover); transform:translate(-50%,-50%) scale(1.05); }
  .ring-center.active { background:rgba(255,255,255,0.1); border-color:rgba(255,255,255,0.2); }
  .cat-circle {
    position:absolute; width:80px; height:80px; border-radius:50%;
    background:var(--surface); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:500; text-align:center;
    cursor:pointer; transition:all 0.3s cubic-bezier(0.16,1,0.3,1);
    padding:4px; line-height:1.2;
    transform:translate(-50%,-50%);
  }
  .cat-circle:hover { background:var(--surface-hover); border-color:var(--line-hover); transform:translate(-50%,-50%) scale(1.1); }
  .cat-circle .count { display:block; font-size:10px; color:var(--text-3); margin-top:2px; }

  /* List View (tools) */
  #listView { display:none; padding:var(--space-4) 0 var(--space-6); }
  .back-btn {
    display:inline-flex; align-items:center; gap:8px;
    background:var(--surface); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:8px 16px; font-size:14px; color:var(--text-2);
    cursor:pointer; transition:all 0.2s; margin-bottom:var(--space-4);
  }
  .back-btn:hover { border-color:var(--line-hover); color:var(--text-1); transform:translateY(-1px); }
  .cat-title { font-family:'Fraunces',serif; font-size:2rem; font-weight:600; margin-bottom:var(--space-3); }
  .search-wrap { margin-bottom:var(--space-3); }
  .search-input {
    width:100%; background:var(--surface); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:12px 16px; color:var(--text-1); font-size:15px; font-family:'Inter',sans-serif;
    outline:none; transition:border-color 0.2s;
  }
  .search-input::placeholder { color:var(--text-3); }
  .search-input:focus { border-color:var(--line-hover); }
  .results-info { font-size:13px; color:var(--text-3); margin-bottom:var(--space-3); font-family:'Space Grotesk',sans-serif; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:var(--space-3); }
  .card {
    background:var(--surface); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border:1px solid var(--line); border-radius:var(--radius);
    padding:var(--space-3); display:flex; flex-direction:column; gap:var(--space-2);
    transition:all 0.3s cubic-bezier(0.16,1,0.3,1);
  }
  .card:hover { background:var(--surface-hover); border-color:var(--line-hover); transform:translateY(-3px); }
  .card .name { font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:16px; }
  .card .desc { font-size:13px; color:var(--text-2); line-height:1.5; flex:1; }
  .card .footer { display:flex; align-items:center; justify-content:space-between; margin-top:var(--space-2); }
  .card .tag { font-size:11px; color:var(--text-3); border:1px solid var(--line); border-radius:6px; padding:2px 8px; }
  .card .open-link { font-size:12px; color:var(--text-2); text-decoration:none; padding:4px 10px; border:1px solid var(--line); border-radius:6px; transition:all 0.2s; }
  .card .open-link:hover { border-color:var(--line-hover); color:var(--text-1); }
  .empty { text-align:center; padding:var(--space-6) 0; color:var(--text-3); }
  .empty h3 { font-family:'Fraunces',serif; font-size:1.5rem; color:var(--text-2); margin-bottom:var(--space-2); }

  footer { border-top:1px solid var(--line); padding:var(--space-5) 0; text-align:center; color:var(--text-3); font-size:13px; }
  footer .big-name { font-family:'Fraunces',serif; font-size:clamp(3rem,10vw,8rem); font-weight:600; color:rgba(255,255,255,0.04); line-height:1; margin-bottom:var(--space-4); letter-spacing:-0.03em; }

  @media (max-width:640px) {
    .ring-center { width:90px; height:90px; font-size:14px; }
    .cat-circle { width:60px; height:60px; font-size:9px; }
    .grid { grid-template-columns:1fr; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
</style>
</head>
<body>

<nav>
  <div class="container inner">
    <div class="logo">FreeTools<span>Hub</span></div>
    <div class="count" id="toolCount">— tools</div>
  </div>
</nav>

<section class="hero">
  <div class="container">
    <h1>Truly free tools.<br>No login. No tiers. No paywall.</h1>
    <p>Tap a category on the ring to explore.</p>
  </div>
</section>

<!-- Ring View -->
<div id="ringView">
  <div class="ring-container" id="ringContainer">
    <div class="ring-center" id="allCenter" onclick="showCategory('All')">ALL</div>
  </div>
</div>

<!-- List View -->
<div id="listView">
  <div class="container">
    <button class="back-btn" onclick="showRing()">← Back to ring</button>
    <h2 class="cat-title" id="catTitle"></h2>
    <div class="search-wrap">
      <input type="text" class="search-input" id="search" placeholder="Search within this category…">
    </div>
    <div class="results-info" id="resultsInfo"></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none;">
      <h3>No tools found</h3>
      <p>Try a different search.</p>
    </div>
  </div>
</div>

<footer>
  <div class="container">
    <div class="big-name">FreeToolsHub</div>
    <p>Curated free tools. No login. No paywall. Open source.</p>
    <p style="margin-top:var(--space-2);">Contact: <a href="mailto:amoghanadiger321@gmail.com" style="color:var(--text-2);">amoghanadiger321@gmail.com</a></p>
  </div>
</footer>

<script>
let tools = [];
let currentCat = 'All';

async function loadTools() {
  const res = await fetch('tools.json');
  tools = await res.json();
  init();
}

function init() {
  document.getElementById('toolCount').textContent = tools.length + ' tools';
  buildRing();
}

function getCats() {
  const cats = [...new Set(tools.map(t => t.cat))].sort();
  return cats;
}

function buildRing() {
  const container = document.getElementById('ringContainer');
  // Remove old cat circles
  container.querySelectorAll('.cat-circle').forEach(c => c.remove());
  const cats = getCats();
  const n = cats.length;
  const radius = Math.min(container.offsetWidth, container.offsetHeight) / 2 - 50;
  const cx = container.offsetWidth / 2;
  const cy = container.offsetHeight / 2;

  cats.forEach((cat, i) => {
    const angle = (2 * Math.PI * i) / n - Math.PI / 2;
    const x = cx + radius * Math.cos(angle);
    const y = cy + radius * Math.sin(angle);
    const count = tools.filter(t => t.cat === cat).length;
    const el = document.createElement('div');
    el.className = 'cat-circle';
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.innerHTML = cat;
    el.onclick = () => showCategory(cat);
    container.appendChild(el);
  });
}

let transitioning = false;

function showCategory(cat) {
  if (transitioning) return;
  transitioning = true;
  currentCat = cat;

  // Find the clicked circle element
  const circles = document.querySelectorAll('.cat-circle, .ring-center');
  let target = null;
  circles.forEach(c => {
    const text = c.textContent.trim();
    if (cat === 'All' && c.classList.contains('ring-center')) target = c;
    else if (text === cat) target = c;
  });
  if (target) target.classList.add('expanding');

  // Fade out ring view
  const ringView = document.getElementById('ringView');
  ringView.classList.add('fading');

  setTimeout(() => {
    ringView.style.display = 'none';
    ringView.classList.remove('fading');
    document.querySelectorAll('.expanding').forEach(e => e.classList.remove('expanding'));

    const listView = document.getElementById('listView');
    listView.style.display = 'block';
    // Trigger fade-in on next frame
    requestAnimationFrame(() => {
      requestAnimationFrame(() => listView.classList.add('visible'));
    });

    document.getElementById('catTitle').textContent = cat === 'All' ? 'All Tools' : cat;
    document.getElementById('search').value = '';
    renderGrid();
    window.scrollTo(0, 0);
    transitioning = false;
  }, 400);
}

function showRing() {
  if (transitioning) return;
  transitioning = true;
  const listView = document.getElementById('listView');
  listView.classList.remove('visible');
  setTimeout(() => {
    listView.style.display = 'none';
    const ringView = document.getElementById('ringView');
    ringView.style.display = 'block';
    requestAnimationFrame(() => {
      requestAnimationFrame(() => ringView.classList.remove('fading'));
    });
    transitioning = false;
  }, 350);
  window.scrollTo(0, 0);
}

function renderGrid() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const filtered = tools.filter(t => {
    const matchCat = currentCat === 'All' || t.cat === currentCat;
    const matchQ = !q || t.name.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q) || t.cat.toLowerCase().includes(q);
    return matchCat && matchQ;
  });
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const info = document.getElementById('resultsInfo');
  if (filtered.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    info.textContent = '';
    return;
  }
  empty.style.display = 'none';
  info.textContent = 'Showing ' + filtered.length + ' of ' + tools.length + ' tools';
  grid.innerHTML = filtered.map(t => `
    <div class="card">
      <div class="name">${esc(t.name)}</div>
      <div class="desc">${esc(t.desc)}</div>
      <div class="footer">
        <span class="tag">${esc(t.cat)}</span>
        <a class="open-link" href="${esc(t.url)}" target="_blank" rel="noopener">Open ↗</a>
      </div>
    </div>
  `).join('');
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

document.getElementById('search').addEventListener('input', renderGrid);

window.addEventListener('resize', buildRing);
loadTools();
</script>
</body>
</html>
